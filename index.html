<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nepali Gig Worker Place</title>
    <!-- Bootstrap 5 for Responsive Design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 
         * GLOBAL COLOR & SIZING RULES
         * Everything blue, text black, medium sizes, mobile responsive.
         */
        * { 
            color: black !important; 
        }
        
        body { 
            background-color: #0d6efd; /* Strong Blue */
            /* 100dvh perfectly fits mobile screens accounting for address bars */
            height: 100dvh; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            font-size: 1rem; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .navbar { 
            flex-shrink: 0; 
            background-color: #0d6efd !important;
            padding: 10px 0;
            border-bottom: 2px solid black;
        }
        
        .navbar-brand {
            font-size: clamp(1.2rem, 4vw, 1.5rem) !important;
            font-weight: 900 !important;
        }

        /* The White Screen Section */
        .screen-section {
            background-color: white; 
            border-radius: 12px;
            flex-grow: 1; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            padding: 10px;
            margin: 10px auto;
            width: 96%;
            max-width: 850px; 
            border: 3px solid black; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Desktop specific screen-section adjustments */
        @media (min-width: 768px) {
            .screen-section {
                padding: 15px;
                margin: 15px auto;
            }
        }

        .view-section { display: none; height: 100%; flex-direction: column; overflow: hidden; }
        .view-section.active { display: flex; }
        .scrollable-view { overflow-y: auto; padding: 5px; }

        /* Custom Scrollbar for the feed container */
        #feed-container::-webkit-scrollbar { width: 6px; }
        #feed-container::-webkit-scrollbar-thumb { background-color: #0d6efd; border-radius: 4px; }
        @media (min-width: 768px) {
            #feed-container::-webkit-scrollbar { width: 8px; }
            #feed-container::-webkit-scrollbar-thumb { border: 1px solid white; }
        }

        /* Problem Cards Styling */
        .post-card { 
            transition: transform 0.2s, box-shadow 0.2s; 
            cursor: pointer; 
            background-color: #e6f0ff !important; 
            border: 1px solid #0d6efd !important;
            border-radius: 10px;
        }
        .post-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.2) !important; 
        }
        
        .card-footer {
            background-color: #cce0ff !important;
            border-top: 1px solid #0d6efd !important;
            border-bottom-left-radius: 6px !important;
            border-bottom-right-radius: 6px !important;
        }

        .copy-text { 
            cursor: pointer; 
            user-select: none; 
            transition: 0.2s; 
            display: inline-block;
            background-color: #e6f0ff;
            padding: 4px 10px;
            border: 2px solid #0d6efd;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .copy-text:hover { background-color: #cce0ff; }

        /* Buttons & Inputs */
        .btn {
            font-weight: 700 !important;
            border: 2px solid black !important;
            border-radius: 8px !important;
            font-size: clamp(0.95rem, 3vw, 1.1rem) !important;
            padding: 8px 15px;
        }
        .btn-primary { background-color: #0d6efd !important; }
        .btn-primary:hover { background-color: #0b5ed7 !important; }
        
        .form-control {
            border: 3px solid #0d6efd !important;
            font-size: clamp(1rem, 3vw, 1.1rem) !important;
            padding: 10px 12px !important;
            border-radius: 8px !important;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a class="navbar-brand m-0" href="#" onclick="showView('feed')">gigfine </a>
            <div id="nav-actions" class="d-flex align-items-center flex-wrap gap-2 justify-content-end">
                <!-- Buttons injected by JS based on login/register status -->
            </div>
        </div>
    </nav>

    <!-- The Central White Screen Section -->
    <div class="screen-section">
        
        <!-- 1. FEED VIEW (Shows all problems) -->
        <div id="view-feed" class="view-section active">
            <h3 class="mb-3 text-center flex-shrink-0 fw-bold text-decoration-underline fs-4">Recent Problems</h3>
            
            <div class="row justify-content-center flex-grow-1 overflow-hidden m-0">
                <div class="col-12 d-flex flex-column h-100 p-0">
                    
                    <!-- SCROLLABLE: Feed Container -->
                    <div id="feed-container" class="flex-grow-1 overflow-auto pe-1 pe-md-2 pb-2">
                        <!-- Posts will be injected here by JS -->
                    </div>
                    
                    <!-- STICKY: Post a Problem Action Container at the bottom -->
                    <div id="post-action-container" class="text-center mt-2 mt-md-3 flex-shrink-0 p-2 p-md-3" style="background-color: #e6f0ff; border: 3px solid black; border-radius: 10px;">
                        <!-- Button/Login text injected here by JS -->
                    </div>

                </div>
            </div>
        </div>

        <!-- 2. LOGIN VIEW -->
        <div id="view-login" class="view-section scrollable-view">
            <div class="row justify-content-center pt-2 pt-md-3">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-sm border-0" style="background-color: #e6f0ff; border: 3px solid #0d6efd !important; border-radius: 10px;">
                        <div class="card-body p-3 p-md-4">
                            <h3 class="card-title text-center mb-4 fw-bold fs-4">Login</h3>
                            <div id="login-error" class="alert fw-bold d-none fs-6" style="background-color: #ffcccc; border: 2px solid red;"></div>
                            
                            <form id="form-login">
                                <div class="mb-4">
                                    <label class="fw-bold mb-2">Password</label>
                                    <input type="password" id="login-password" class="form-control" required placeholder="Enter your password...">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                            
                            <!-- Dynamic text injected by JS based on registration status -->
                            <div id="login-reg-link" class="mt-3 text-center fw-bold fs-6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. REGISTER VIEW -->
        <div id="view-register" class="view-section scrollable-view">
            <div class="row justify-content-center pt-2 pt-md-3">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-sm border-0" style="background-color: #e6f0ff; border: 3px solid #0d6efd !important; border-radius: 10px;">
                        <div class="card-body p-3 p-md-4">
                            <h3 class="card-title text-center mb-4 fw-bold fs-4">Register Account</h3>
                            <div id="register-error" class="alert fw-bold d-none fs-6" style="background-color: #ffcccc; border: 2px solid red;"></div>
                            
                            <form id="form-register">
                                <div class="mb-3">
                                    <label class="fw-bold mb-2">Your Full Name</label>
                                    <input type="text" id="reg-name" class="form-control" required placeholder="What should we call you?">
                                </div>
                                <div class="mb-4">
                                    <label class="fw-bold mb-2">Create a Password</label>
                                    <input type="password" id="reg-password" class="form-control" required placeholder="Type a strong password...">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Register</button>
                            </form>
                            
                            <div class="mt-3 text-center fw-bold fs-6">
                                Already registered? <a href="#" onclick="showView('login')" class="text-decoration-underline">Login here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. UPDATE PASSWORD VIEW -->
        <div id="view-update-pw" class="view-section scrollable-view">
            <div class="row justify-content-center pt-2 pt-md-3">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-sm border-0" style="background-color: #e6f0ff; border: 3px solid #0d6efd !important; border-radius: 10px;">
                        <div class="card-body p-3 p-md-4">
                            <h3 class="card-title text-center mb-4 fw-bold fs-4">Update Password</h3>
                            <div id="update-pw-error" class="alert fw-bold d-none fs-6" style="background-color: #ffcccc; border: 2px solid red;"></div>
                            
                            <form id="form-update-pw">
                                <div class="mb-3">
                                    <label class="fw-bold mb-2">Current Password</label>
                                    <input type="password" id="update-old-pw" class="form-control" required placeholder="Enter current password...">
                                </div>
                                <div class="mb-4">
                                    <label class="fw-bold mb-2">New Password</label>
                                    <input type="password" id="update-new-pw" class="form-control" required placeholder="Enter new password...">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Update Password</button>
                            </form>
                            
                            <div class="mt-3 text-center fw-bold fs-6">
                                <a href="#" onclick="showView('login')" class="text-decoration-underline">Cancel and return to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. POST PROBLEM VIEW -->
        <div id="view-post" class="view-section scrollable-view">
            <div class="row justify-content-center pt-2 pt-md-3">
                <div class="col-12 col-lg-10">
                    <div class="card shadow-sm" style="border: 3px solid black; border-radius: 10px; overflow: hidden;">
                        <div class="card-header p-2 p-md-3" style="background-color: #0d6efd;">
                            <h4 class="mb-0 fw-bold text-center text-white fs-5" style="color: white !important;">Share your problem</h4>
                        </div>
                        <div class="card-body p-3 p-md-4" style="background-color: #e6f0ff;">
                            <form id="form-post">
    <!-- NEW: Select Company Dropdown -->
    <div class="mb-4">
        <label class="form-label fw-bold mb-2">Which company is this regarding?</label>
        <select id="post-company" class="form-select border border-3 border-primary" style="font-size: clamp(1rem, 3vw, 1.1rem); padding: 10px 12px; border-radius: 8px; font-weight: 600;" required>
            <option value="" disabled selected>Select a company...</option>
            <option value="Pathao">Pathao</option>
            <option value="InDrive">InDrive</option>
            <option value="InDrive">Yango</option>
            <option value="Tootle">Tootle</option>
            <option value="Sajilo">Sajilo</option>
            <option value="JumJum">JumJum</option>
            <option value="InDrive">ChiyaCut</option>
            <option value="Other / General">Other / General</option>
        </select>
    </div>
    
    <div class="mb-4">
        <label class="form-label fw-bold mb-2">What problem are you facing?</label>
        <textarea id="post-text" class="form-control" rows="6" required placeholder="Describe your problem here in detail..."></textarea>
    </div>
    <div class="d-flex flex-column flex-sm-row gap-2 gap-md-3">
        <button type="submit" class="btn btn-primary w-100">Submit Post</button>
        <button type="button" class="btn w-100" style="background-color: white;" onclick="showView('feed')">Cancel</button>
    </div>
</form>
                        </div>
                    </div>
                </div>
            </div>
        </div>



    </div>

    <!-- Main JavaScript Logic -->
    <script>
        // --- 1. Database Simulation (LocalStorage) ---
        function getDB(key) {
            return JSON.parse(localStorage.getItem(key)) || [];
        }
        function saveDB(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

      // --- 2. UI Navigation & Authentication State ---
        function updateNav() {
            const navActions = document.getElementById('nav-actions');
            const postActionContainer = document.getElementById('post-action-container');
            const loginRegLink = document.getElementById('login-reg-link');
            
            // Check if ANY user has been registered yet
            let users = getDB('users');
            let isRegistered = users.length > 0;

            if (currentUser) {
                // Logged in Navigation
                navActions.innerHTML = `
                    <span class="fw-bold fs-6 d-none d-sm-inline">Hi, ${currentUser.name}</span>
                    <button class="btn btn-sm" style="background-color: white;" onclick="showView('update-pw')">Update Password</button>
                    <button class="btn btn-sm btn-primary" onclick="logout()">Logout</button>
                `;
                
                // STICKY BOTTOM CONTAINER (Logged In) - Added Claim Insurance Button
                postActionContainer.innerHTML = `
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-primary w-100 py-2 py-md-3 shadow-sm fw-bold fs-5 fs-md-4" onclick="showView('post')">
                            ➕ Share your problem
                        </button>
                        <button class="btn w-100 py-2 py-md-3 shadow-sm fw-bold fs-5 fs-md-4" style="background-color: #ffc107; border: 2px solid black; color: black !important;" onclick="jumpToInsurance()">
                            🛡️ Claim Insurance
                        </button>
                    </div>
                `;
            } else {
                // Logged out Navigation
                let rightSideButton = isRegistered 
                    ? `<button class="btn btn-sm btn-primary" onclick="showView('update-pw')">Update PW</button>`
                    : `<button class="btn btn-sm btn-primary" onclick="showView('register')">Register</button>`;

                navActions.innerHTML = `
                    <button class="btn btn-sm" style="background-color: white;" onclick="showView('login')">Login</button>
                    ${rightSideButton}
                `;
                
                // STICKY BOTTOM CONTAINER (Logged Out) - Added Claim Insurance Button
                postActionContainer.innerHTML = `
                    <p class="m-0 fw-bold fs-6 mb-2">Please <a href="#" onclick="showView('login')" class="text-decoration-underline">login</a> to access features.</p>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn w-100 py-2 py-md-3 shadow-sm fw-bold fs-5 fs-md-4" style="background-color: #e9ecef; border: 2px solid black; color: black !important;" onclick="showView('login')">
                            🛡️ Claim Insurance
                        </button>
                    </div>
                `;
            }

            // Update Login bottom text based on if system is Registered
            if (loginRegLink) {
                if (isRegistered) {
                    loginRegLink.innerHTML = `Want to change access? <br class="d-sm-none"><a href="#" onclick="showView('update-pw')" class="text-decoration-underline">Update Password here</a>`;
                } else {
                    loginRegLink.innerHTML = `Don't have an account yet? <br class="d-sm-none"><a href="#" onclick="showView('register')" class="text-decoration-underline">Register here</a>`;
                }
            }
            
        }

        function showView(viewId) {
            // Hide alerts every time views change
            document.getElementById('login-error').classList.add('d-none');
            document.getElementById('register-error').classList.add('d-none');
            document.getElementById('update-pw-error').classList.add('d-none');

            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            
            if(viewId === 'register') document.getElementById('form-register').reset();
            if(viewId === 'login') document.getElementById('form-login').reset();
            if(viewId === 'post') document.getElementById('form-post').reset();
            if(viewId === 'update-pw') document.getElementById('form-update-pw').reset();

            if(viewId === 'feed') renderFeed();
        }

        // --- 3. Registration Logic (Only 1 time allowed) ---
        document.getElementById('form-register').addEventListener('submit', function(e) {
            e.preventDefault();
            let users = getDB('users');
            
            if (users.length >= 1) {
                alert("An account is already registered! Please use 'Update Password' if needed.");
                showView('update-pw');
                return;
            }

            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const newUser = { id: Date.now(), name: name, password: password };
            
            users.push(newUser);
            saveDB('users', users);
            
            alert("Account Registered Successfully! You can now login.");
            updateNav();
            showView('login');
        });

        // --- 4. Update Password Logic ---
        document.getElementById('form-update-pw').addEventListener('submit', function(e) {
            e.preventDefault();
            const oldPw = document.getElementById('update-old-pw').value.trim();
            const newPw = document.getElementById('update-new-pw').value.trim();

            let users = getDB('users');
            if (users.length === 0) {
                alert("No account registered yet!");
                showView('register');
                return;
            }

            if (users[0].password !== oldPw) {
                const err = document.getElementById('update-pw-error');
                err.innerText = "Current password is incorrect!";
                err.classList.remove('d-none');
                return;
            }

            users[0].password = newPw;
            saveDB('users', users);
            
            alert("Password updated successfully! Please login using your new password.");
            logout(); 
            showView('login');
        });

        // --- 5. Login Logic ---
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('login-password').value.trim();

            const users = getDB('users');
            const user = users.find(u => u.password === password);

            if (user) {
                currentUser = { id: user.id, name: user.name || "User" };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateNav();
                showView('feed');
            } else {
                const err = document.getElementById('login-error');
                err.innerText = "Invalid password!";
                err.classList.remove('d-none');
            }
        });

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateNav();
            showView('feed');
        }

        // --- 6. Post Problem Logic ---
        
document.getElementById('form-post').addEventListener('submit', function(e) {
    e.preventDefault();
    const company = document.getElementById('post-company').value; // Get selected company
    const text = document.getElementById('post-text').value.trim();

    if (!currentUser) {
        alert("Please login first!");
        showView('login');
        return;
    }

    let problems = getDB('problems');
    
    const newProblem = {
        id: Date.now(),
        userId: currentUser.id,
        userName: currentUser.name,
        company: company, // Save company data to LocalStorage
        text: text,
        timestamp: new Date().toISOString()
    };

    problems.push(newProblem);
    saveDB('problems', problems);
    showView('feed');
});

        // --- 7. Copy Functionality Logic ---
        function copyProblemText(id) {
            const textElement = document.getElementById('text-' + id);
            if (!textElement) return;

            const rawText = decodeURIComponent(textElement.getAttribute('data-raw-text'));
            
            navigator.clipboard.writeText(rawText).then(() => {
                const copyBtn = document.getElementById('copy-btn-' + id);
                if(copyBtn) {
                    copyBtn.innerHTML = "✅ Copied!";
                    setTimeout(() => {
                        copyBtn.innerHTML = "📋 Copy text";
                    }, 2000);
                }
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }
// --- 8. Render Feed Logic ---
        function renderFeed() {
            const container = document.getElementById('feed-container');
            let problems = getDB('problems');

            // Sort newest first
            problems.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            if (problems.length === 0) {
                container.innerHTML = `<div class="p-3 p-md-4 text-center fw-bold fs-6 fs-md-5" style="background-color: #e6f0ff; border: 3px dashed #0d6efd; border-radius: 10px;">No problems have been posted yet. Be the first!</div>`;
                return;
            }

            container.innerHTML = '';
            
            problems.forEach(post => {
                const dateObj = new Date(post.timestamp);
                const formattedDate = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString();

                // Safely escape HTML to prevent cross-site scripting in the UI
                const safeText = post.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const safeName = post.userName ? post.userName.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "Anonymous";
                const safeCompany = post.company ? post.company.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "General";
                
                // FORMAT CLIPBOARD DATA: Company Name on top, Message under it
                const clipboardCompany = post.company || "General";
                const textToCopy = clipboardCompany + "\n\n" + post.text; 
                
                // Encode the formatted text for the copy button
                const encodedText = encodeURIComponent(textToCopy);

                // Responsive Card Layout
                const card = `
                    <div class="mb-3 mb-md-4">
                        <!-- 1. Copy text entirely outside the problem box -->
                        <div class="text-end mb-1 pe-1">
                            <span id="copy-btn-${post.id}" class="fw-bold copy-text" onclick="copyProblemText(${post.id})">
                                📋 Copy text
                            </span>
                        </div>
                        
                        <!-- 2. The problem Box itself (Clickable) -->
                        <div class="card shadow-sm post-card border-0" title="Click anywhere on the card to copy problem text" onclick="copyProblemText(${post.id})">
                            <div class="card-body p-3 p-md-4">
                                <p id="text-${post.id}" data-raw-text="${encodedText}" class="card-text fw-bold mb-0 fs-6 fs-md-5" style="white-space: pre-wrap; line-height: 1.5;">"${safeText}"</p>
                            </div>
                            <div class="card-footer p-2 p-md-3 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-1">
                                <small class="fs-6 text-break d-flex align-items-center flex-wrap gap-2">
                                    <strong>${safeName}</strong> 
                                    <span class="badge bg-primary text-white border border-dark border-1 px-2 py-1">${safeCompany}</span>
                                </small>
                                <small class="fw-bold fs-6" style="opacity: 0.8; font-size: 0.85rem !important;">${formattedDate}</small>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // --- 9. Initialize App ---
        updateNav();
        showView('feed'); 
    </script>
    <script>
    function jumpToInsurance() {
        // This jumps to the insurance page
        window.location.href = "insurance.html";
    }
</script>
</body>
</html>
